server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 512M;

    location / {
        rewrite ^/$ /index.php?link1=home last;
        rewrite ^/@([^\/]+)(\/|)$ /index.php?link1=timeline&id=$1 last;
        try_files $uri /index.php?link1=$uri&$query_string;
    }

    location /admin-cp {
        rewrite ^/admin-cp$ /admincp.php last;
        rewrite ^/admin-cp/(.*)$ /admincp.php?page=$1 last;
    }

    location /aj {
        rewrite ^/aj/([^/.]+)/?$ /ajax.php?type=$1 last;
        rewrite ^/aj/([^/.]+)/([^/.]+)/?$ /ajax.php?type=$1&first=$2 last;
        rewrite ^/aj/([^/.]+)/([^/.]+)/([^/.]+)/?$ /ajax.php?type=$1&first=$2&second=$3 last;
    }

    location /watch {
        rewrite ^/watch/([^\/]+)(\/|)?$ /index.php?link1=watch&id=$1 last;
    }

    location /live {
        rewrite ^/live(\/|)?$ /index.php?link1=live last;
    }

    location /chef-live-hls/ {
        proxy_pass http://chef-live-engine:8888/live/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

location /chef-live-webrtc/ {
    proxy_pass http://chef-live-engine:8889/live/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect /live/ /chef-live-webrtc/;
    proxy_redirect http://chef-live-engine:8889/live/ /chef-live-webrtc/;
}

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 300;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|mp4|m3u8|ts)$ {
        expires 7d;
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }
}
