    header("Location: " . PT_Link('admincp'));
    exit();
}
$page = $db->where('lang_key',PT_Secure($_GET['type']))->getOne(T_LANGS);
?>
<div class="container-fluid">
    <div>
        <h3>Modifier les pages légales</h3>

            </ol>
        </nav>
    </div>
    <!-- Vertical Layout -->
    <div class="row">
        <div class="col-lg-8 col-md-8">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-title">Modifier les pages légales</h6>
                    <div class="add-settings-alert"></div>
                    <form class="add-settings" method="POST">
                        <?php 
                        foreach ($page as $key => $value) {
                            if (!in_array($key, array('id','lang_key','type'))  ) { ?>
                        <div class="form-group form-float">
                            <div class="form-line">
                                <label class="form-label"><?php echo(ucfirst($key)) ?> (HTML autorisé)</label>
                                <textarea name="<?php echo($key); ?>" id="<?php echo($key); ?>" class="form-control" cols="30" rows="10"><?php echo $value;?></textarea>
                            </div>
                        </div>
                        <br>
                        <?php } }  ?>
                        <input type="hidden" name="lang_key" value="<?php echo $page->lang_key;?>">
                        <button type="submit" class="btn btn-primary m-t-15 waves-effect">Enregistrer</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="clearfix"></div>
    </div>
    <!-- #END# Vertical Layout -->
<script>

$(function() {
    <?php 
    foreach ($page as $key => $value) {
        if (!in_array($key, array('id','lang_key','type'))  ) { ?>
    PT_AdminInitTinyMCE({
          selector: '#<?php echo($key); ?>',
          height: 270,
          entity_encoding : "raw",
          images_upload_url: '{{LINK aj/ap/tinymce-upload}}',
		  language_url: '{{CONFIG theme_url}}/js/tinymce/js/tinymce/langs/fr_FR.js',
		  language : "fr_FR",
          toolbar: "undo redo | blocks fontfamily fontsize | bold italic underline | alignleft aligncenter alignright alignjustify | bullist numlist checklist | link image media table | forecolor backcolor | preview fullscreen code | ptimageupload",
    });
    <?php } }  ?>
    var form_add_settings = $('form.add-settings');
    form_add_settings.ajaxForm({
        url: '{{LINK aj/ap/save-terms}}',
        beforeSend: function() {
            form_add_settings.find('.waves-effect').text('Veuillez patienter...');
        },
        beforeSubmit : function(arr, $form, options){
            for (var i = 0; i < arr.length; i++) {
                if (arr[i].name != "hash_id" && arr[i].name != "lang_key") {
                    arr[i].value = btoa(unescape(encodeURIComponent($("#"+arr[i].name).value=tinymce.editors[$("#"+arr[i].name).attr('id')].getContent())));
                }
            }
        },
        success: function(data) {
            if (data.status == 200) {
                $("html, body").animate({ scrollTop: 0 }, "slow");
                $('.add-settings-alert').html('<div class="alert alert-success"><i class="fa fa-check"></i> Pages enregistrées avec succès</div>');
                location.reload()
            } else if (data.status == 400) {
              $('.add-settings-alert').html('<div class="alert alert-danger">'+data.message+'</div>');
                setTimeout(function () {
                    $('.add-settings-alert').empty();
                }, 2000);
            }
            form_add_settings.find('.waves-effect').text('Enregistrer');
        }
    });
});
</script>
