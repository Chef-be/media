<div class="container-fluid">
  <div class="block-header">
    <h2>Studio vidéo</h2>
  </div>
  <div class="card">
    <div class="header">
      <h2>Paramètres</h2>
    </div>
    <div class="body">
      <form class="form" method="POST" id="editor-settings-form">
        <div class="form-group">
          <label>Activer le studio</label>
          <select class="form-control show-tick" name="video_editor_enabled">
            <option value="on" <?php echo ($pt->config->video_editor_enabled == 'on') ? 'selected' : '';?>>Activé</option>
            <option value="off" <?php echo ($pt->config->video_editor_enabled == 'off') ? 'selected' : '';?>>Désactivé</option>
          </select>
        </div>
        <div class="form-group">
          <label>Résolution max</label>
          <input type="text" class="form-control" name="editor_max_resolution" value="<?php echo $pt->config->editor_max_resolution ?: '1920x1080';?>">
        </div>
        <div class="form-group">
          <label>Bitrate max (kbps)</label>
          <input type="number" class="form-control" name="editor_max_bitrate" value="<?php echo $pt->config->editor_max_bitrate ?: '8000';?>">
        </div>
        <button class="btn btn-primary" type="submit">Enregistrer</button>
      </form>
      <div id="resp"></div>
    </div>
  </div>
</div>
<script>
$('#editor-settings-form').on('submit', function(e){
  e.preventDefault();
  var data = $(this).serialize();
  $.post('{{LINK aj/ap/save-settings}}', data, function(r){
    if(r.status==200){ $('#resp').html('<div class="alert alert-success">Enregistré</div>'); }
    else { $('#resp').html('<div class="alert alert-danger">Erreur</div>'); }
  });
});
</script>
