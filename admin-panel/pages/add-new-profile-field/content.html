<div class="container-fluid">
    <div>
        <h3>Créer un nouveau champ personnalisé</h3>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="#">Panneau d'administration</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="#">Utilisateurs</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Créer un nouveau champ personnalisé</li>
            </ol>
        </nav>
    </div>
    <!-- Vertical Layout -->
    <div class="row">
        <div class="col-lg-8 col-md-8">
            <div class="card">
                <div class="card-body">
                    <h6 class="card-title">Créer un nouveau champ personnalisé</h6>
                    <div class="add-settings-alert"></div>
                    <div class="alert alert-info">Utilisez {{ LANG lang_variable }} pour traduire la donnée du champ. ex : {{ LANG first_name }}</div>
                    <form class="add-settings" method="POST">
                        <label for="type">Type de champ</label>
                        <select class="form-control show-tick chosen-select" id="type" name="type">
                          <option value="textbox">Champ texte</option>
               	          <option value="textarea">Zone de texte</option>
               	          <option value="select">Liste déroulante</option>
                        </select>
                        <div class="clearfix"></div>
                        <br>
                        <div class="form-group form-float">
                            <div class="form-line">
                                <label class="form-label">Nom du champ</label>
                                <input type="text" id="name" name="name" class="form-control">
                            </div>
                        </div>
                       
                        <div class="form-group form-float">
                            <div class="form-line">
                                <label class="form-label">Longueur du champ : <small>La valeur par défaut est 32, et la valeur maximale est 1000</small></label>
                                <input type="text" id="length" name="length" class="form-control" value="32">
                            </div>
                        </div>
                        <div class="form-group form-float">
                            <div class="form-line">
                                <label class="form-label">Description du champ : <small>La description apparaîtra sous le champ</small></label>
                                <textarea name="description" id="description" class="form-control" cols="30" rows="3"></textarea>
                            </div>
                        </div>
                        <label for="placement">Emplacement du champ</label>
                        <select class="form-control show-tick " id="placement" name="placement">
                         <option value="general">Paramètres généraux</option>
		                 <option value="profile">Paramètres du profil</option>
		                 <option value="social">Liens sociaux</option>
		                 <option value="none">Ne pas afficher le champ dans la page des paramètres</option>
                        </select>
                        <div class="clearfix"></div>
                        <br>
                        <label for="registration_page">Afficher sur la page d'inscription</label>
                        <select class="form-control show-tick" id="registration_page" name="registration_page">
                         		<option value="0" selected>Non</option>
                 				<option value="1">Oui</option>
                        </select>
                        <div class="clearfix"></div>
                        <br>
                        <label for="profile_page">Afficher sur la page de profil utilisateur</label>
                        <select class="form-control show-tick" id="profile_page" name="profile_page">
                         		<option value="0" selected>Non</option>
                 				<option value="1">Oui</option>
                        </select>
                        <div class="clearfix"></div>
                        <br><br>
                        <div class="form-group form-float options" style="display:none">
                            <div class="form-line">
                                <label class="form-label">Options de la liste déroulante : <small>Une option par ligne.</small></label>
                                <textarea name="options" id="options" class="form-control" cols="30" rows="3"></textarea>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary m-t-15 waves-effect">Créer</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="clearfix"></div>
    </div>
    <!-- #END# Vertical Layout -->
<script>
jQuery(document).ready(function($) {
    $('#type').on('change', function(evt, params) {
       var selectedValue = $(this).val();
       if (selectedValue == 'select') {
          $('.options').fadeIn(200);
       } 
       else {
          $('.options').fadeOut(200);
       }
       setTimeout(function () {
            $(".content").getNiceScroll().resize();
        }, 300);
    });

    var form_add_settings = $('form.add-settings');
    form_add_settings.ajaxForm({
        url: '{{LINK aj/ap/add-field}}',
        beforeSend: function() {
            form_add_settings.find('.waves-effect').text('Veuillez patienter...');
        },
        success: function(data) {
            if (data.status == 200) {
                $("html, body").animate({ scrollTop: 0 }, "slow");
                $('.add-settings-alert').html('<div class="alert alert-success"><i class="fa fa-check"></i> Champ ajouté avec succès</div>');
                setTimeout(function () {
                    window.location.href = "<?php echo PT_LoadAdminLinkSettings('manage-profile-fields'); ?>";
                }, 1000);
            }

            else if (data.status == 400) {
                $('.add-settings-alert').html('<div class="alert alert-danger">'+data.message+'</div>');
                setTimeout(function () {
                    $('.add-settings-alert').html('');
                }, 2000);
            }
            form_add_settings.find('.waves-effect').text('Créer');
        }
    });
});
</script>
