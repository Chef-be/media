<script>
    jQuery(document).ready(function($) {
        PT_AdminInitTinyMCE({
          selector: '#new-article',
          auto_focus: 'element1',
          height: 500,
          images_upload_url: '{{LINK aj/ap/tinymce-upload}}',
		  language_url: '{{CONFIG theme_url}}/js/tinymce/js/tinymce/langs/fr_FR.js',
		  language : "fr_FR"
        });

        $(".preview-article-image").click(function(event) {
            $("#article-image").trigger('click');
        });

        $("#article-image").change(function(event) {
            var self       = $(this);
            var image_blob = false;

            if (window.URL !== undefined) {
                image_blob = window.URL.createObjectURL(self.prop('files')[0]);
            } 

            else if (window.webkitURL !== undefined) {
                image_blob = window.webkitURL.createObjectURL(self.prop('files')[0]);
            } 

            if (image_blob) {
              $(".preview-article-image").html("<img src='" + image_blob + "' alt='Picture'>");  
            }
            
        });

        $('#article-tags').tagsinput();
        var form = $(".submit-new-article-settings");
        form.submit(function(event) {
            var text    = tinymce.activeEditor.getContent({format: 'raw'});
            var message = $(".create-article-alert");
            if (!text){
                scrollToTop();
                message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> Une erreur est survenue. Veuillez réessayer !</div>');
                setTimeout(function(){
                    window.location.reload();
                },1000);
                return false;
            }
            else{
                $("#new-article").val(text);
            }
        });
        $(function() {

            form.ajaxForm({
                url: "{{LINK aj/ap/update-article}}",
                type:"POST",
                dataType:"json",
                data:{},
                beforeSend: function() {
                    
                },
                success: function(data) {
                    var message = $(".create-article-alert");
                    if (data.status == 200) {
                        scrollToTop();
                        message.html('<div class="alert alert-success"><i class="fa fa-exclamation-circle"></i> Article enregistré avec succès !</div>');
                        setTimeout(function(){
                            window.location.href = data.url;
                        },1000);
                    }

                    else if (data.status == 400) {
                        scrollToTop();
                        message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> Veuillez remplir les informations requises !</div>');
                    }

                    else if (data.status == 401) {
                        scrollToTop();
                        message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> Le titre de l’article est trop court !</div>');
                    }

                    else if (data.status == 402) {
                        scrollToTop();
                        message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> La description de l’article est trop courte !</div>');
                    }

                    else if (data.status == 403) {
                        scrollToTop();
                        message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> Le contenu de l’article est requis !</div>');
                    } 

                    else if (data.status == 404) {
                        scrollToTop();
                        message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> Le fichier est trop volumineux, veuillez augmenter la limite d’upload du serveur dans php.ini !</div>');
                    }

                    else if (data.status == 405) {
                        scrollToTop();
                        message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> Le fichier image n’est pas valide. Veuillez sélectionner une image valide !</div>');
                    }

                    else if (data.status == 406) {
                        scrollToTop();
                        message.html('<div class="alert alert-warning"><i class="fa fa-exclamation-circle"></i> ID de catégorie invalide. Veuillez vérifier vos informations !</div>');
                    }

                    else if (data.status == 500) {
                        scrollToTop();
                        message.html('<div class="alert alert-danger"><i class="fa fa-exclamation-circle"></i> Une erreur est survenue, veuillez réessayer plus tard !</div>');
                    }
                }
            });
        }); 
    }); 
</script>
