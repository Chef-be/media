<script>
jQuery(document).ready(function($) {
    PT_AdminInitTinyMCE({
        selector: '#new-article',
        height: 500,
        auto_focus: 'element1',
        images_upload_url: '{{LINK aj/ap/tinymce-upload}}',
        language_url: '{{CONFIG theme_url}}/js/tinymce/js/tinymce/langs/fr_FR.js',
        language: "fr_FR"
    });

    $(".preview-article-image").on("click", function() {
        $("#article-image").trigger("click");
    });

    $("#article-image").on("change", function() {
        var self = $(this);
        var image_blob = false;

        if (window.URL !== undefined) {
            image_blob = window.URL.createObjectURL(self.prop('files')[0]);
        } else if (window.webkitURL !== undefined) {
            image_blob = window.webkitURL.createObjectURL(self.prop('files')[0]);
        }

        if (image_blob) {
            $(".preview-article-image").html("<img src='" + image_blob + "' alt='Image'>");
        }
    });

    $(function() {
        $('#article-tags').tagsinput();

        var form = $(".submit-new-article-settings");

        form.on("submit", function() {
            var text    = tinymce.activeEditor.getContent({format: 'raw'});
            var message = $(".create-article-alert");

            if (!text) {
                scrollToTop();
                message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> Une erreur s'est produite. Veuillez réessayer&nbsp;!</div>");
                setTimeout(function(){ window.location.reload(); }, 1000);
                return false;
            } else {
                $("#new-article").val(text);
            }
        });

        form.ajaxForm({
            url: "{{LINK aj/ap/new-article}}",
            type: "POST",
            dataType: "json",
            beforeSend: function() {},
            success: function(data) {
                var message = $(".create-article-alert");

                if (data.status == 200) {
                    scrollToTop();
                    message.html("<div class='alert alert-success'><i class='fa fa-exclamation-circle'></i> Le nouvel article a été ajouté avec succès&nbsp;!</div>");
                    setTimeout(function(){ window.location.href = data.url; }, 1000);
                }
                else if (data.status == 400) {
                    scrollToTop();
                    message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> Veuillez renseigner les informations requises&nbsp;!</div>");
                }
                else if (data.status == 401) {
                    scrollToTop();
                    message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> Le titre de l'article est trop court&nbsp;!</div>");
                }
                else if (data.status == 402) {
                    scrollToTop();
                    message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> La description de l'article est trop courte&nbsp;!</div>");
                }
                else if (data.status == 403) {
                    scrollToTop();
                    message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> Le contenu de l'article est requis&nbsp;!</div>");
                }
                else if (data.status == 404) {
                    scrollToTop();
                    message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> Le fichier est trop volumineux, augmentez la limite de téléversement du serveur dans php.ini&nbsp;!</div>");
                }
                else if (data.status == 405) {
                    scrollToTop();
                    message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> Le fichier image n'est pas valide. Veuillez sélectionner une image valide&nbsp;!</div>");
                }
                else if (data.status == 406) {
                    scrollToTop();
                    message.html("<div class='alert alert-warning'><i class='fa fa-exclamation-circle'></i> Identifiant de catégorie invalide. Veuillez vérifier vos informations&nbsp;!</div>");
                }
                else if (data.status == 500) {
                    scrollToTop();
                    message.html("<div class='alert alert-danger'><i class='fa fa-exclamation-circle'></i> Une erreur s'est produite, veuillez réessayer plus tard&nbsp;!</div>");
                }
            }
        });
    });
});
</script>
