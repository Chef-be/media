<div class="container-fluid">
    <div>
        <h3>Infolettres</h3>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="#">Administration</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="#">Outils</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Infolettres</li>
            </ol>
        </nav>
    </div>
    <!-- Vertical Layout -->
    <div class="row">
        <div class="col-lg-6 col-md-6">
            <div class="card">
                <div class="card-body">
                  <h6 class="card-title">Infolettres</h6>
                    <div id="alert"></div>
                    <form class="mailing-settings" method="POST">
                        <div class="form-group form-float">
                            <div class="form-line">
                              <label class="form-label">Objet</label>
                                <input type="text" id="subject" name="subject" class="form-control">
                            </div>
                        </div>
                        <div class="form-group form-float">
                            <div class="form-line">
                              <label class="form-label">Message (HTML autorisé)</label>
                                <textarea name="message" id="message" class="form-control" cols="30" rows="10"></textarea>
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <button type="submit" class="btn btn-primary m-t-15 waves-effect">Envoyer</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="clearfix"></div>
    </div>
    <!-- #END# Vertical Layout -->
<script>
$(function () {
    PT_AdminInitTinyMCE({
        selector: '#message',
        height:500,
        images_upload_url: '{{LINK aj/ap/tinymce-upload}}',
		language_url: '{{CONFIG theme_url}}/js/tinymce/js/tinymce/langs/fr_FR.js',
		language : "fr_FR",
    });
   $('form.mailing-settings').ajaxForm({
      url: '{{LINK aj/ap/newsletters}}',
      beforeSend: function () {
         $('form.mailing-settings').find('.waves-effect').text('Veuillez patienter...');
      },
      success: function (data) {
         if (data.status == 400) {
            $("#alert").html('<div class="alert alert-danger">'+ data['message'] +'</div>');
         } else if (data.status == 200) {
            $("#alert").html('<div class="alert alert-success">Message envoyé !</div>');
         } else if (data.status == 300) {
            $("#alert").html('<div class="alert alert-success">Les messages sont en cours d’envoi en arrière-plan.</div>');
         }
         $('form.mailing-settings').find('.waves-effect').text('Envoyer');
      }
   });
});
</script>
